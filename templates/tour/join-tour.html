{% extends 'base.html' %}
{% load static %}

{% block title %}
Join Tour
{% endblock %}

{% block content %}
<div class="min-h-screen relative flex items-center justify-center px-4 py-12 overflow-hidden"
     style="background-image: url('{% static 'img/map-bg.jpg' %}'); background-size: cover; background-position: center;">
    
    <!-- Background overlay matching screenshot -->
    <div class="absolute inset-0 bg-slate-900/30 backdrop-blur-[2px]"></div>

    <!-- Top Right Theme Toggle -->
    <div class="absolute top-6 right-6 z-20">
        <button type="button"
                class="theme-toggle w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-slate-800 shadow-md border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition btn-ripple cursor-pointer text-lg"
                title="Toggle Light/Dark Theme"
                aria-label="Toggle Light/Dark Theme">
            <span class="dark:hidden"><i class="fa-solid fa-moon text-slate-700"></i></span>
            <span class="hidden dark:inline"><i class="fa-solid fa-sun text-amber-400"></i></span>
        </button>
    </div>

    <!-- Join Tour Card -->
    <div class="relative z-10 w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-white/20 transition-all">
        
        <!-- Card Header (Solid Royal Blue) -->
        <div class="bg-[#2563eb] px-8 py-7 text-white flex items-center gap-4">
            <img src="{% static 'img/logo-icon.png' %}" alt="Pay-Together Logo" class="w-14 h-14 rounded-2xl object-cover bg-white p-1 shadow-md shrink-0">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight">Join Tour</h1>
                <p class="text-blue-100 text-sm mt-1.5 font-normal">Enter your Join Code to become a tour member.</p>
            </div>
        </div>

        <!-- Card Body -->
        <div class="p-8 space-y-6">
            
            <!-- Message / Alert Box -->
            <div id="messageBox" class="text-sm"></div>

            {% if tour %}
            <!-- Tour Context Hint -->
            <div class="p-3.5 bg-blue-50/80 border border-blue-100 rounded-xl flex items-center justify-between text-xs text-blue-900 font-semibold">
                <span class="flex items-center gap-1.5 truncate">
                    <i class="fa-solid fa-plane text-blue-600"></i>
                    <span class="truncate">{{ tour.title }}</span>
                </span>
                <span class="text-blue-600 font-bold shrink-0 ml-2">{{ tour_destination|default:"" }}</span>
            </div>
            {% endif %}

            <!-- Form -->
            <form id="joinTourForm" class="space-y-6">
                {% csrf_token %}

                <div>
                    <label for="joinTokenInput" class="block text-slate-800 font-bold text-sm mb-2.5">
                        Join Code
                    </label>
                    <input
                        id="joinTokenInput"
                        type="text"
                        name="join_token"
                        placeholder="ENTER JOIN CODE"
                        value="{{ join_token }}"
                        required
                        autofocus
                        class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3.5 text-slate-800 placeholder:text-slate-400 placeholder:font-medium placeholder:uppercase focus:outline-none focus:border-[#2563eb] focus:ring-4 focus:ring-blue-500/10 text-base uppercase font-semibold tracking-wider transition"
                    />
                </div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    id="joinSubmitBtn"
                    class="w-full bg-[#2563eb] hover:bg-[#1d4ed8] active:bg-[#1e40af] text-white py-3.5 px-6 rounded-xl font-semibold text-base transition shadow-lg shadow-blue-500/25 cursor-pointer flex items-center justify-center gap-2"
                >
                    Join Tour
                </button>
            </form>

            <div class="pt-2 text-center">
                <a href="/client/tours/" class="text-xs text-slate-400 hover:text-slate-600 font-medium transition">
                    Back to All Tours
                </a>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'js/api.js' %}"></script>
<script src="{% static 'js/join_tour.js' %}"></script>
{% endblock %}
