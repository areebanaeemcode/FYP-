{% extends 'base.html' %}
{% load static %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}

<div class="min-h-screen bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-blue-700 shadow-lg">

        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

            <h1 class="text-white text-2xl font-bold">
                Expense Tracker
            </h1>

            <div class="flex items-center gap-3">
                <button
                    type="button"
                    class="theme-toggle bg-blue-800 hover:bg-blue-900 text-white w-10 h-10 rounded-lg flex items-center justify-center transition cursor-pointer text-lg"
                    title="Toggle Light/Dark Theme"
                >
                    <span class="dark:hidden"><i class="fa-solid fa-moon"></i></span>
                    <span class="hidden dark:inline"><i class="fa-solid fa-sun text-amber-300"></i></span>
                </button>
                <button
                    id="logoutButton"
                    class="bg-red-500 hover:bg-red-600 px-5 py-2 rounded-lg text-white font-semibold flex items-center gap-2"
                >
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>

        </div>

    </nav>

    <!-- Main Content -->

    <div class="max-w-6xl mx-auto mt-10">

        <!-- Welcome Card -->

        <div class="bg-white rounded-xl shadow-lg p-8">

            <h2 class="text-3xl font-bold text-blue-700 flex items-center gap-2">

                Welcome,

                <span id="userName">

                    User

                </span>

                <i class="fa-solid fa-hand text-amber-500 text-2xl"></i>

            </h2>

            <p class="text-gray-600 mt-3">

                You have successfully logged in.

            </p>

        </div>

        <!-- User Details -->

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">

            <div class="bg-white rounded-xl shadow-lg p-6">

                <h3 class="text-xl font-semibold mb-5">

                    User Information

                </h3>

                <div class="space-y-3">

                    <p>

                        <strong>ID:</strong>

                        <span id="userId">

                            -

                        </span>

                    </p>

                    <p>

                        <strong>Name:</strong>

                        <span id="userFirstName">

                            -

                        </span>

                    </p>

                    <p>

                        <strong>Email:</strong>

                        <span id="userEmail">

                            -

                        </span>

                    </p>

                </div>

            </div>

            <div class="bg-white rounded-xl shadow-lg p-6">

                <h3 class="text-xl font-semibold mb-5">

                    JWT Status

                </h3>

                <p class="text-green-600 font-semibold">

                    Access Token Saved Successfully

                </p>

            </div>

        </div>

    </div>

</div>

<script src="{% static 'js/dashboard.js' %}"></script>

{% endblock %}
